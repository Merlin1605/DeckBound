<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<filter id="grit" filterUnits="userSpaceOnUse" x="-50" y="-50" width="2100" height="1200" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0" result="m"/>
  <feComponentTransfer in="m" result="t">
    <feFuncR type="linear" slope="0.56" intercept="0.58"/>
    <feFuncG type="linear" slope="0.56" intercept="0.58"/>
    <feFuncB type="linear" slope="0.56" intercept="0.58"/>
    <feFuncA type="linear" slope="0" intercept="1"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="t" mode="multiply" result="b"/>
  <feComposite in="b" in2="SourceGraphic" operator="in"/>
</filter></defs>
