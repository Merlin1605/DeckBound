<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<filter id="grit" filterUnits="userSpaceOnUse" x="-50" y="-50" width="2100" height="1200" color-interpolation-filters="sRGB">
